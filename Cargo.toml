[workspace]
members = ["crates/app", "crates/ui", "crates/terminal", "crates/ssh", "crates/editor", "crates/agent"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tokio", "advanced", "svg", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
